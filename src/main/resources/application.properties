# ── Server ──────────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0

# ── Database ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/train_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false

# ── External API (RailRadar v1 API) ──────────────
app.provider.base-url=https://api.railradar.in/v1
app.provider.api-key=rg_29ff45ddf27545b489600ec225f0c977
app.provider.poll-interval-ms=15000

# ── Tracking ─────────────────────────────────────────────
# Milliseconds before a position is considered stale
app.tracking.stale-threshold-ms=120000
# Snap train marker to route if distance > tolerance (metres)
app.tracking.snap-tolerance-metres=500
# Save tracking history snapshots every N updates (0 = disabled)
app.tracking.history-snapshot-every=5

# ── Simulation mode ──────────────────────────────────────
# Set false for real API tracking; true for demo/offline simulation
app.simulation.enabled=false

# ── Logging ──────────────────────────────────────────────
logging.level.com.traintracker=INFO
